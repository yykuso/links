<style>
:root {
    --bg: #f3ede1;
    --card: #fffcf5;
    --ink: #1f2a2e;
    --muted: #5f6b6d;
    --line: #ddd3c1;
    --contour: #c9bda6;
    --sea: #1d6f8a;
    --stamp: #c8462a;
    --shadow: 0 1px 0 rgba(60, 45, 20, .06), 0 8px 24px -12px rgba(60, 45, 20, .25);
    --font: 'Noto Sans JP', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    color-scheme: light;
}
[data-theme="dark"] {
    --bg: #0d1a20;
    --card: #142730;
    --ink: #e8e2d4;
    --muted: #93a3a6;
    --line: #24404b;
    --contour: #1f3b46;
    --sea: #5fb7cf;
    --stamp: #ef7a5c;
    --shadow: 0 1px 0 rgba(0, 0, 0, .2), 0 10px 28px -14px rgba(0, 0, 0, .7);
    color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
    min-height: 100vh;
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    transition: background-color .3s, color .3s;
}
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
:focus-visible { outline: 2px solid var(--sea); outline-offset: 3px; }

/* ---------- 背景の等高線 ---------- */
.topo {
    position: fixed; inset: 0; z-index: -1;
    width: 100%; height: 100%;
    pointer-events: none;
}
.topo use, .topo .ring { fill: none; stroke: var(--contour); stroke-width: 1; vector-effect: non-scaling-stroke; transition: stroke .3s; }
.topo .route { fill: none; stroke: var(--sea); stroke-width: 1.5; stroke-dasharray: 2 8; stroke-linecap: round; opacity: .45; vector-effect: non-scaling-stroke; }

/* ---------- レイアウト ---------- */
.wrap { max-width: 520px; margin: 0 auto; padding: 56px 20px 40px; }

/* ---------- テーマ切替 ---------- */
.theme-toggle {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line); box-shadow: var(--shadow);
    cursor: pointer; transition: transform .2s, background-color .3s;
}
.theme-toggle:hover { transform: rotate(-15deg) scale(1.06); }
.theme-toggle svg { width: 20px; height: 20px; }
.theme-toggle .sun { display: none; }
[data-theme="dark"] .theme-toggle .sun { display: block; }
[data-theme="dark"] .theme-toggle .moon { display: none; }

/* ---------- プロフィール ---------- */
.profile { text-align: center; }
.badge { position: relative; width: 168px; height: 168px; margin: 0 auto 18px; }
.badge__ring {
    position: absolute; inset: 0; width: 100%; height: 100%;
    animation: spin 40s linear infinite;
}
.badge__ring text { font-family: var(--mono); font-size: 10.5px; letter-spacing: .5px; fill: var(--sea); }
.badge__ring circle { fill: none; stroke: var(--sea); stroke-width: 1; opacity: .5; }
.badge img {
    position: absolute; top: 50%; left: 50%;
    width: 112px; height: 112px; margin: -56px 0 0 -56px;
    border-radius: 50%; object-fit: cover;
    border: 4px solid var(--card);
    box-shadow: 0 0 0 1px var(--line), var(--shadow);
    transition: transform .35s cubic-bezier(.3, 1.6, .5, 1);
}
.badge:hover img { transform: scale(1.06) rotate(-6deg); }
@keyframes spin { to { transform: rotate(360deg); } }

.profile h1 { margin: 0; font-size: 2rem; font-weight: 900; letter-spacing: .04em; line-height: 1.3; }
.profile .handle { font-family: var(--mono); font-size: .8rem; color: var(--muted); }
.profile .bio { margin: 6px 0 0; font-weight: 500; }

.voyage {
    display: flex; align-items: center; gap: 10px;
    margin: 22px auto 0; max-width: 320px;
    font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; color: var(--muted);
}
.voyage__line { flex: 1; height: 0; border-top: 1.5px dashed var(--line); position: relative; }
.voyage__ship {
    position: absolute; top: -11px; left: 0; width: 20px; height: 20px; color: var(--sea);
    animation: sail 9s ease-in-out infinite alternate;
}
@keyframes sail { from { left: 0; } to { left: calc(100% - 20px); } }

/* ---------- セクション見出し ---------- */
.section { margin-top: 44px; }
.section__head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.section__no { font-family: var(--mono); font-size: .7rem; letter-spacing: .14em; color: var(--sea); white-space: nowrap; }
.section__head h2 { margin: 0; font-size: 1.05rem; font-weight: 700; }
.section__head::after { content: ""; flex: 1; border-top: 1px solid var(--line); transform: translateY(-4px); }

/* ---------- リンク（チケット） ---------- */
.tickets { display: flex; flex-direction: column; gap: 10px; }
.ticket {
    --stub: 54px;
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 14px;
    min-height: 66px; padding: 10px calc(var(--stub) + 12px) 10px 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow);
    transition: transform .2s ease-out, border-color .2s, background-color .3s;
}
/* 切り取り線の左右の切り欠き */
.ticket::before, .ticket::after {
    content: ""; position: absolute; right: calc(var(--stub) - 7px);
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--bg); border: 1px solid var(--line);
    transition: background-color .3s;
}
.ticket::before { top: -8px; }
.ticket::after { bottom: -8px; }
.ticket:hover { transform: translateY(-2px); border-color: var(--sea); }

.ticket__icon {
    flex: none; width: 46px; height: 46px; border-radius: 10px;
    display: grid; place-items: center; color: #fff;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12);
}
.ticket__icon svg { width: 24px; height: 24px; margin: 0; }
.ticket__body { min-width: 0; display: flex; flex-direction: column; }
.ticket__name { font-weight: 700; line-height: 1.35; }
.ticket__sub { font-family: var(--mono); font-size: .74rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ticket__stub {
    position: absolute; top: 0; right: 0; bottom: 0; width: var(--stub);
    display: grid; place-items: center;
    border-left: 1.5px dashed var(--line); color: var(--muted);
}
.ticket__stub svg { width: 18px; height: 18px; transition: transform .2s; }
.ticket:hover .ticket__stub { color: var(--sea); }
.ticket:hover .ticket__stub svg { transform: translateX(3px); }

.ticket.is-paused .ticket__icon { filter: grayscale(.6); opacity: .75; }
.stamp {
    position: absolute; right: calc(var(--stub) + 14px); top: 50%;
    transform: translateY(-50%) rotate(-12deg);
    padding: 1px 8px; border: 2px solid var(--stamp); border-radius: 6px;
    font-size: .72rem; font-weight: 900; letter-spacing: .15em; color: var(--stamp);
    opacity: .85;
}

/* ---------- 自作サービス（ポストカード） ---------- */
.cards { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 480px) { .cards { grid-template-columns: 1fr 1fr; } }
.card {
    display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px; box-shadow: var(--shadow);
    transition: transform .25s ease-out, border-color .2s, background-color .3s;
}
.card:nth-child(odd) { transform: rotate(-.6deg); }
.card:nth-child(even) { transform: rotate(.6deg); }
.card:hover { transform: rotate(0) translateY(-3px); border-color: var(--sea); }
.card__thumb { position: relative; overflow: hidden; border-radius: 7px; aspect-ratio: 16 / 9; background: var(--line); }
.card__thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease-out; }
.card:hover .card__thumb img { transform: scale(1.05); }
.card__no {
    position: absolute; top: 8px; left: 8px;
    padding: 2px 7px; border-radius: 4px;
    background: rgba(13, 26, 32, .72); color: #fff;
    font-family: var(--mono); font-size: .64rem; letter-spacing: .1em;
}
.card__body { padding: 10px 6px 4px; display: flex; flex-direction: column; flex: 1; }
.card__body h3 { margin: 0; font-size: .98rem; }
.card__body p { margin: 4px 0 10px; font-size: .82rem; color: var(--muted); line-height: 1.55; }
.card__thumb--repo {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    padding: 12px; color: #e6edf3; text-align: center;
    background:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, .05) 0 1px, transparent 1px 14px),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, .05) 0 1px, transparent 1px 14px),
        linear-gradient(135deg, #1f2a33, #0d1117);
}
.card__thumb--repo svg { width: 34px; height: 34px; transition: transform .4s ease-out; }
.card:hover .card__thumb--repo svg { transform: scale(1.08) rotate(-6deg); }
.card__repo { font-family: var(--mono); font-size: .68rem; line-height: 1.4; word-break: break-all; opacity: .85; }
.card__tags { display: flex; flex-wrap: wrap; gap: 4px; margin: -4px 0 10px; }
.card__tag { font-family: var(--mono); font-size: .62rem; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.card__host { margin-top: auto; font-family: var(--mono); font-size: .68rem; color: var(--sea); }

/* ---------- フッター ---------- */
footer { margin-top: 48px; text-align: center; font-size: .78rem; color: var(--muted); }
footer .bon { font-family: var(--mono); letter-spacing: .2em; font-size: .68rem; margin-bottom: 4px; }

/* ---------- 登場アニメーション ---------- */
.reveal { animation: rise .55s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 45ms); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

    // テーマ切替
    const toggle = document.getElementById('theme-toggle');
    const media = window.matchMedia('(prefers-color-scheme: dark)');
    function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        toggle.setAttribute('aria-label', theme === 'dark' ? 'ライトモードに切り替え' : 'ダークモードに切り替え');
    }
    applyTheme(document.documentElement.dataset.theme);
    toggle.addEventListener('click', () => {
        const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        try { localStorage.setItem('theme', next); } catch (e) {}
    });
    media.addEventListener('change', (e) => {
        let stored = null;
        try { stored = localStorage.getItem('theme'); } catch (err) {}
        if (!stored) applyTheme(e.matches ? 'dark' : 'light');
    });

    // プロフィール
    document.getElementById('profile-name').textContent = profile.name;
    document.getElementById('profile-bio').textContent = profile.bio;
    document.getElementById('profile-image').src = profile.imageUrl;
    document.getElementById('year').textContent = new Date().getFullYear();
    document.getElementById('footer-name').textContent = profile.name;

    // SNSリンク
    const linksContainer = document.getElementById('links-container');
    const linkFragment = document.createDocumentFragment();
    socialLinks.forEach((link, i) => {
        const a = document.createElement('a');
        a.href = link.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.className = 'ticket reveal' + (link.isPaused ? ' is-paused' : '');
        a.style.setProperty('--i', i + 2);
        a.innerHTML = `
            <span class="ticket__icon" style="background:${link.color}">${link.icon}</span>
            <span class="ticket__body">
                <span class="ticket__name">${link.name}</span>
                ${link.sub ? `<span class="ticket__sub">${link.sub}</span>` : ''}
            </span>
            ${link.isPaused ? '<span class="stamp">休止中</span>' : ''}
            <span class="ticket__stub" aria-hidden="true">${arrowIcon}</span>
        `;
        linkFragment.appendChild(a);
    });
    linksContainer.appendChild(linkFragment);

    // 自作サービス
    const projectsSection = document.getElementById('projects-section');
    const projectsContainer = document.getElementById('projects-container');
    if (projectLinks.length > 0) {
        const projectFragment = document.createDocumentFragment();
        projectLinks.forEach((project, i) => {
            const a = document.createElement('a');
            a.href = project.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.className = 'card reveal';
            a.style.setProperty('--i', socialLinks.length + i + 2);
            const no = `<span class="card__no">No.${String(i + 1).padStart(2, '0')}</span>`;
            // サムネイルが無いリポジトリはGitHub風の表紙を描く
            const thumb = project.thumbnailUrl
                ? `<div class="card__thumb">
                        <img src="${project.thumbnailUrl}" alt="${project.name}のサムネイル"
                             loading="lazy" decoding="async" onerror="this.style.display='none'">
                        ${no}
                   </div>`
                : `<div class="card__thumb card__thumb--repo">
                        ${githubIcon}
                        <span class="card__repo">${project.repo || project.name}</span>
                        ${no}
                   </div>`;
            const tags = (project.tags || []).map(t => `<span class="card__tag">${t}</span>`).join('');
            a.innerHTML = `
                ${thumb}
                <div class="card__body">
                    <h3>${project.name}</h3>
                    <p>${project.description}</p>
                    ${tags ? `<div class="card__tags">${tags}</div>` : ''}
                    <span class="card__host">${project.repo ? 'GitHub' : new URL(project.url).hostname} ↗</span>
                </div>
            `;
            projectFragment.appendChild(a);
        });
        projectsContainer.appendChild(projectFragment);
    } else {
